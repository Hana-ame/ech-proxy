name: ech-proxy-flutter-lib

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Android NDK
        run: |
          NDK_VERSION="r27"
          curl -L -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp/
          echo "/tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # FFI 契约先跑：导出符号少一个，编译照样成功，但 twitter-pic-flutter
      # 真机上会在 Dart 侧 lookupFunction 抛 ArgumentError 而启动即崩。
      # 那种失败在下游仓库排查成本极高，所以放在这里挡住。
      - name: Verify FFI export contract
        run: go test ./flutter/

      - name: Build ECH shared library (android/arm64)
        run: |
          CGO_ENABLED=1 \
          GOOS=android \
          GOARCH=arm64 \
          CC=aarch64-linux-android21-clang \
          go build -buildmode=c-shared -ldflags="-s -w" \
          -o dist/libechproxy.so ./flutter/
          /tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy --strip-unneeded dist/libechproxy.so
          ls -lh dist/libechproxy.so

      - name: Build ECH shared library (windows/amd64)
        run: |
          CGO_ENABLED=1 \
          GOOS=windows \
          GOARCH=amd64 \
          go build -buildmode=c-shared -ldflags="-s -w" \
          -o dist/echproxy.dll ./flutter/
          ls -lh dist/echproxy.dll

      - name: Verify exported symbols in the built artifacts
        run: |
          echo "--- android ---"
          for s in ECHInitWithBootstrap ECHSetDohURL StartProxy StopProxy GetProxyPort IsEchReady FreeCString ECHInitReady ECHInitLastError ECHGetLogCount ECHGetLog ECHInit; do
            nm -D --defined-only dist/libechproxy.so | grep -qw "$s" || { echo "::error::android 产物缺少导出符号 $s"; exit 1; }
          done
          echo "android 12/12 符号齐全"
          echo "--- windows ---"
          for s in ECHInitWithBootstrap ECHSetDohURL StartProxy StopProxy GetProxyPort IsEchReady FreeCString ECHInitReady ECHInitLastError ECHGetLogCount ECHGetLog ECHInit; do
            nm -D --defined-only dist/echproxy.dll | grep -qw "$s" || { echo "::error::windows 产物缺少导出符号 $s"; exit 1; }
          done
          echo "windows 12/12 符号齐全"

      - name: Package
        run: |
          cd dist
          tar czf ../ech-proxy-flutter-linux-amd64.tar.gz libechproxy.so echproxy.dll
          cd ..
          ls -lh ech-proxy-flutter-linux-amd64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ech-proxy-flutter-lib
          path: |
            ech-proxy-flutter-linux-amd64.tar.gz
            dist/libechproxy.so
            dist/echproxy.dll

      # 只在 tag 上发 Release：推分支只留 artifact，不产生 Release，
      # 避免 Release 列表被日常构建淹没（与 twitter-pic-flutter 的做法一致）。
      - name: Publish to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ech-proxy flutter lib ${{ github.ref_name }}
          files: |
            ech-proxy-flutter-linux-amd64.tar.gz
            dist/libechproxy.so
            dist/echproxy.dll
          fail_on_unmatched_files: true