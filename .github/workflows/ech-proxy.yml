name: ech-proxy

on:
  push:
    branches: [main]
    paths:
      - "win/**"
      - "echproxy/**"
      - "certs/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ech-proxy.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet and unit tests before packaging
        run: |
          go vet ./...
          grep -q 'DefaultSiteHost = "4545810.xyz"' echproxy/netdial/netdial.go
          go test ./... -race

      - name: Setup Patched Go SDK for Windows 7 (XTLS/go-win7)
        # 借鉴 XTLS/Xray-core 的 Windows 7 构建方案：
        # 官方 Go 1.21.5+ 将 RtlGenRandom 替换为仅 Win8+ 存在的 bcryptprimitives.dll!ProcessPrng，
        # 导致在 Win7 (386/amd64) 启动阶段即崩溃 (Exception 0xc0000005 PC=0x0 in asmstdcall)。
        # 使用 XTLS/go-win7 (patched-1.26.7) 补丁版 SDK 编译 Windows 产物，既保留 uTLS v1.8.2 的 ECH 能力，
        # 又将随机数与控制台/文件系统调用替换为 Win7 兼容实现 (BCryptGenRandom)。
        run: |
          mkdir -p /tmp/go-win7
          curl -fsSL -o /tmp/go-win7.zip "https://github.com/XTLS/go-win7/releases/download/patched-1.26.7/go-for-win7-linux-amd64.zip" \
            || curl -fsSL -o /tmp/go-win7.zip "https://github.com/XTLS/go-win7/releases/latest/download/go-for-win7-linux-amd64.zip"
          unzip -q /tmp/go-win7.zip -d /tmp/go-win7
          GO_BIN="$(find /tmp/go-win7 -type f -name go -perm -u+x | head -n1)"
          if [ -z "$GO_BIN" ]; then
            echo "::error::Failed to locate go binary in XTLS/go-win7 archive"
            exit 1
          fi
          GO_BIN_DIR="$(dirname "$GO_BIN")"
          GO_ROOT_DIR="$(dirname "$GO_BIN_DIR")"
          echo "$GO_BIN_DIR" >> "$GITHUB_PATH"
          echo "GOROOT=$GO_ROOT_DIR" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          "$GO_BIN" version

      - name: Build ech-proxy (Windows & Linux, amd64 & 386 in parallel)
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ech-proxy-windows-amd64.exe ./win/ &
          PID_WIN64=$!
          GOOS=windows GOARCH=386   CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ech-proxy-windows-386.exe ./win/ &
          PID_WIN32=$!
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ech-proxy-linux-amd64 ./win/ &
          PID_LNX64=$!
          GOOS=linux   GOARCH=386   CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ech-proxy-linux-386 ./win/ &
          PID_LNX32=$!
          wait $PID_WIN64
          wait $PID_WIN32
          wait $PID_LNX64
          wait $PID_LNX32

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ech-proxy-desktop
          path: |
            ech-proxy-windows-amd64.exe
            ech-proxy-windows-386.exe
            ech-proxy-linux-amd64
            ech-proxy-linux-386
