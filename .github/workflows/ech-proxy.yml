name: ech-proxy

on:
  push:
    branches: [main]
    paths:
      - "win/**"
      - "echproxy/**"
      - "certs/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ech-proxy.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run go vet and unit tests before packaging
        run: |
          go vet ./...
          node --check certs/l.moonchan.xyz/ad_script.js
          go test ./... -race

      - name: Build ech-proxy (Windows amd64)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ech-proxy-windows-amd64.exe ./win/

      - name: Build ech-proxy (Windows 386)
        run: GOOS=windows GOARCH=386 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ech-proxy-windows-386.exe ./win/

      - name: Build ech-proxy (Linux amd64)
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ech-proxy-linux-amd64 ./win/

      - name: Build ech-proxy (Linux 386)
        run: GOOS=linux GOARCH=386 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ech-proxy-linux-386 ./win/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ech-proxy-desktop
          path: |
            ech-proxy-windows-amd64.exe
            ech-proxy-windows-386.exe
            ech-proxy-linux-amd64
            ech-proxy-linux-386
