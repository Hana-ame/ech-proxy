name: Go CI & Smoke Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run go vet across all packages (Linux & Windows targets)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
          GOOS=windows GOARCH=386   CGO_ENABLED=0 go vet ./...

      - name: Validate upstream.json configuration
        run: go run ./win check -config certs/l.moonchan.xyz/upstream.json

      - name: Validate remote asset defaults (single source; certs/ is 8443-only)
        run: |
          # certs/ 仅归属 8443 方案；ads.js / pac.txt / block.json 一律走远端默认地址。
          grep -q 'DefaultSiteHost = "4545810.xyz"' echproxy/netdial/netdial.go
          grep -q '/ads.js"' echproxy/rewrite/adscript.go
          grep -q '/pac.txt"' echproxy/rewrite/adscript.go
          grep -q '/adult.txt"' echproxy/rewrite/adscript.go
          grep -q '/block.json"' echproxy/rewrite/adscript.go
          test ! -e certs/l.moonchan.xyz/ads.js
          test ! -e certs/l.moonchan.xyz/pac.txt

      - name: Run full unit & integration tests with race detector
        run: go test ./... -race -v -coverprofile=coverage.out

      - name: Cross-compile verification (Windows 386/amd64/arm64, Linux 386/amd64/arm64, macOS amd64)
        run: |
          mkdir -p build-check
          GOOS=windows GOARCH=386   CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build-check/ech-proxy-windows-386.exe ./win/
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build-check/ech-proxy-windows-amd64.exe ./win/
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build-check/ech-proxy-windows-arm64.exe ./win/
          GOOS=linux   GOARCH=386   CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build-check/ech-proxy-linux-386 ./win/
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build-check/ech-proxy-linux-amd64 ./win/
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build-check/ech-proxy-linux-arm64 ./win/
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build-check/ech-proxy-darwin-amd64 ./win/
          rm -rf build-check

      - name: CLI tool commands verification (version, check, pac, help)
        run: |
          CGO_ENABLED=0 go build -trimpath -o ./ech-proxy-ci ./win/
          ./ech-proxy-ci version
          ./ech-proxy-ci help | grep -q -- "-whitelist-url"
          ./ech-proxy-ci check -config certs/l.moonchan.xyz/upstream.json
          ./ech-proxy-ci pac -config certs/l.moonchan.xyz/upstream.json | grep -q "FindProxyForURL"
          rm -rf ./ech-proxy-ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
