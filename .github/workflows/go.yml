name: Go CI & Smoke Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run go vet across all packages (Linux & Windows targets in parallel)
        run: |
          go vet ./... &
          PID1=$!
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./... &
          PID2=$!
          GOOS=windows GOARCH=386   CGO_ENABLED=0 go vet ./... &
          PID3=$!
          wait $PID1
          wait $PID2
          wait $PID3

      - name: Validate upstream.json configuration
        run: go run ./win check -config certs/l.moonchan.xyz/upstream.json

      - name: Validate remote asset defaults (single source; certs/ is 8443-only)
        run: |
          # certs/ 仅归属 8443 方案；ads.js / pac.txt / block.json 一律走远端默认地址。
          grep -q 'DefaultSiteHost = "4545810.xyz"' echproxy/netdial/netdial.go
          grep -q '/ads.js"' echproxy/rewrite/adscript.go
          grep -q '/pac.txt"' echproxy/rewrite/adscript.go
          grep -q '/bypass.txt"' echproxy/rewrite/adscript.go
          grep -q '/adult.txt"' echproxy/rewrite/adscript.go
          grep -q '/block.json"' echproxy/rewrite/adscript.go
          test ! -e certs/l.moonchan.xyz/ads.js
          test ! -e certs/l.moonchan.xyz/pac.txt
          test ! -e certs/l.moonchan.xyz/bypass.txt

      - name: Validate v3.6.5 invariants (No-DoH 4545810.xyz, ECH-only HTTP/3, direct quic-go)
        run: |
          # 4545810.xyz 严禁走 DoH，必须经由 ResolveDefaultSiteHost（系统 DNS -> 一次性回退内置 CF Anycast IP）
          grep -q 'ResolveDefaultSiteHost' echproxy/netdial/netdial.go
          grep -q 'ResolveDefaultSiteHost' echproxy/ech/sni.go
          # HTTP/3 备选方案仅限 ECH 通道，SNI 通道绝不引用 http3 / doECHHTTP3
          grep -q 'doECHHTTP3' echproxy/ech/client.go
          ! grep -Eq 'doECHHTTP3|quic-go|http3' echproxy/ech/sni.go
          # quic-go 必须为 go.mod 直接依赖（非 indirect）
          grep -Eq '^[[:space:]]+github\.com/quic-go/quic-go v' go.mod
          ! grep -Eq 'github\.com/quic-go/quic-go v.*// indirect' go.mod
          # TLS 本地 CA 与敏感域名安全加固不变量
          grep -q 'MaxPathLenZero:[[:space:]]*true' echproxy/certstore/certstore.go
          grep -q 'InsecureSkipVerify:[[:space:]]*certCheck != nil' echproxy/netdial/netdial.go
          grep -q 'DefaultSensitiveBypassDomains' echproxy/rewrite/bypass_defaults.go
          test -f bypass.txt

      - name: Run full unit & integration tests with race detector
        run: go test ./... -race -v -coverprofile=coverage.out

      - name: Setup Patched Go SDK for Windows 7 (XTLS/go-win7)
        # 借鉴 XTLS/Xray-core 的 Windows 7 构建方案：
        # 官方 Go 1.21.5+ 将 RtlGenRandom 替换为仅 Win8+ 存在的 bcryptprimitives.dll!ProcessPrng，
        # 导致在 Win7 (386/amd64) 启动阶段即崩溃 (Exception 0xc0000005 PC=0x0 in asmstdcall)。
        # 使用 XTLS/go-win7 (patched-1.26.7) 补丁版 SDK 编译 Windows 产物，既保留 uTLS v1.8.2 的 ECH 能力，
        # 又将随机数与控制台/文件系统调用替换为 Win7 兼容实现 (BCryptGenRandom)。
        run: |
          mkdir -p /tmp/go-win7
          curl -fsSL -o /tmp/go-win7.zip "https://github.com/XTLS/go-win7/releases/download/patched-1.26.7/go-for-win7-linux-amd64.zip" \
            || curl -fsSL -o /tmp/go-win7.zip "https://github.com/XTLS/go-win7/releases/latest/download/go-for-win7-linux-amd64.zip"
          unzip -q /tmp/go-win7.zip -d /tmp/go-win7
          GO_BIN="$(find /tmp/go-win7 -type f -name go -perm -u+x | head -n1)"
          if [ -z "$GO_BIN" ]; then
            echo "::error::Failed to locate go binary in XTLS/go-win7 archive"
            exit 1
          fi
          GO_BIN_DIR="$(dirname "$GO_BIN")"
          GO_ROOT_DIR="$(dirname "$GO_BIN_DIR")"
          echo "$GO_BIN_DIR" >> "$GITHUB_PATH"
          echo "GOROOT=$GO_ROOT_DIR" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          "$GO_BIN" version

      - name: Cross-compile verification (Windows 386/amd64/arm64, Linux 386/amd64/arm64, macOS amd64 in parallel)
        run: |
          mkdir -p build-check
          GOOS=windows GOARCH=386   CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build-check/ech-proxy-windows-386.exe ./win/ &
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build-check/ech-proxy-windows-amd64.exe ./win/ &
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build-check/ech-proxy-windows-arm64.exe ./win/ &
          GOOS=linux   GOARCH=386   CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build-check/ech-proxy-linux-386 ./win/ &
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build-check/ech-proxy-linux-amd64 ./win/ &
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build-check/ech-proxy-linux-arm64 ./win/ &
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build-check/ech-proxy-darwin-amd64 ./win/ &
          wait
          rm -rf build-check

      - name: CLI tool commands verification (version, check, pac, bypass, help)
        run: |
          CGO_ENABLED=0 go build -trimpath -o ./ech-proxy-ci ./win/
          ./ech-proxy-ci version
          HELP_OUT="$(./ech-proxy-ci help)"
          echo "$HELP_OUT" | grep -q -- "-whitelist-url"
          echo "$HELP_OUT" | grep -q -- "-bypass-url"
          echo "$HELP_OUT" | grep -q -- "-bypass-file"
          echo "$HELP_OUT" | grep -q -- "-no-local-bypass"
          echo "$HELP_OUT" | grep -q -- "-ech-h3"
          echo "$HELP_OUT" | grep -q -- "-fallback"
          ./ech-proxy-ci check -config certs/l.moonchan.xyz/upstream.json
          printf 'claude.ai\n.openai.com\n' > /tmp/ci-bypass.txt
          ./ech-proxy-ci pac -config certs/l.moonchan.xyz/upstream.json -no-local-pac -bypass-file /tmp/ci-bypass.txt -fallback 127.0.0.1:7890 > /tmp/ci-pac.js
          grep -q "FindProxyForURL" /tmp/ci-pac.js
          grep -q "BYPASS_EXACT_HOSTS" /tmp/ci-pac.js
          grep -q "BYPASS_SUFFIX_RULES" /tmp/ci-pac.js
          grep -q '"claude.ai"' /tmp/ci-pac.js
          grep -q '"openai.com"' /tmp/ci-pac.js
          grep -q 'PROXY 127.0.0.1:7890' /tmp/ci-pac.js
          rm -rf ./ech-proxy-ci /tmp/ci-bypass.txt /tmp/ci-pac.js

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
