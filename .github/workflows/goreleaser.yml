name: goreleaser

# Stage 1 of the GoReleaser rollout: build and publish as a DRAFT release.
#
# Trigger scope is deliberately narrow. The existing release.yml already fires
# on tags v*, and its final step unconditionally re-uploads a Windows binary to
# the v1.0.0 release with --clobber. A tag matching v* would therefore trigger
# two publish paths AND mutate a published, unrelated release.
#
# So this workflow only triggers on tags under goreleaser-draft-*. That prefix
# cannot match the v* glob, which is what makes a stage-1 trial safe to run for
# real.
#
# Stage 2 (turning draft: false and adopting a real version tag) is a separate,
# deliberate change. Do not widen this trigger as part of the draft trial.

on:
  push:
    tags:
      - "goreleaser-draft-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Install first, then validate. A bare `run: goreleaser check` step
      # placed before this fails with "command not found" (exit 127) — the
      # first tag push caught exactly that.
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
