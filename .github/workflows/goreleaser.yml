name: goreleaser

# Stage 1 of the GoReleaser rollout: build and publish as a DRAFT release.
#
# Tag scope: v*-rc.* and v*-beta.* only.
#
# GoReleaser requires the tag itself to parse as semver, so a non-semver prefix
# (the "goreleaser-draft-" scheme used on the first two trial tags) is rejected
# outright. Every semver tag, however, matches release.yml's original v* glob.
# release.yml therefore keeps v* but skips all of its jobs for -rc / -beta tags,
# so the two publish paths do not overlap.
#
# Stage 2 (dropping draft: false and adopting a plain version tag) is a
# separate, deliberate change. Do not widen this trigger as part of the trial.

on:
  push:
    tags:
      - "v*-rc.*"
      - "v*-beta.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Install first, then validate. A bare `run: goreleaser check` step
      # placed before this fails with "command not found" (exit 127) — the
      # first tag push caught exactly that.
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
