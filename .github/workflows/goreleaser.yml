name: goreleaser

# Publishes desktop binaries and checksums with GoReleaser.
#
# THIS REPOSITORY DOES NOT PRODUCE DRAFTS. A draft is invisible to
# unauthenticated readers, so a leftover one reads as "no release exists"
# while its assets sit there unpublished. The first rollout produced exactly
# that and it had to be deleted rather than kept. `draft: false` is hardcoded
# in .goreleaser.yaml, and the "Refuse to leave a draft behind" step below turns
# any future regression into a red build instead of a silent draft.
#
# Tag scope: v* — plain releases, rc and beta alike.
#
# On a plain tag this workflow and release.yml both run: release.yml builds the
# Android APKs, GoReleaser builds the desktop binaries plus checksums. Their
# asset names do not collide, and both upload to the same release.
#
# On -rc / -beta tags release.yml skips all of its jobs, so only GoReleaser
# publishes and a prerelease can never claim "latest" (make_latest: false).
#
# GoReleaser requires the tag to parse as semver, so the original
# "goreleaser-draft-" tag prefix is not an option; that is why draft was
# expressed as a config flag rather than as a tag convention.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Install first, then validate. A bare `run: goreleaser check` step
      # placed before this fails with "command not found" (exit 127) — the
      # first tag push caught exactly that.
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true

      - name: Refuse to run with draft enabled in config
        # Fails fast, before publishing anything, if someone re-enables draft.
        run: |
          if grep -Eq '^[[:space:]]*draft:[[:space:]]*true' .goreleaser.yaml; then
            echo "::error::.goreleaser.yaml has draft: true; this repository does not produce drafts"
            exit 1
          fi
          echo "draft is disabled"

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to leave a draft behind
        # Post-condition, not a precondition: verifies what actually happened
        # rather than what the config intended. A draft that appeared anyway
        # gets published here and fails the build, so it cannot linger.
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft_tag=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[] | select(.draft == true) | .tag_name')
          if [ -n "$draft_tag" ]; then
            echo "::error::draft release(s) present after a run: $draft_tag"
            for t in $draft_tag; do
              gh release edit "$t" --draft=false --repo "${{ github.repository }}"
            done
            echo "published the draft(s) above; build marked failed on purpose"
            exit 1
          fi
          echo "no draft releases"
