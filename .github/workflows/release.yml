name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows]
        arch: [amd64, aarch64]
        exclude:
          - os: windows
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build ech-proxy desktop (static, CGO off for old-glibc/Termux)
        run: |
          ext=""
          [ "${{ matrix.os }}" = "windows" ] && ext=".exe"
          mkdir -p "dist/${{ matrix.os }}/${{ matrix.arch }}"
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }} CGO_ENABLED=0 \
             go build -trimpath -ldflags="-s -w" \
             -o "dist/${{ matrix.os }}/${{ matrix.arch }}/ech-proxy-${{ matrix.os }}-${{ matrix.arch }}${ext}" "./ech-proxy/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ matrix.os }}/${{ matrix.arch }}/

  # Android APK 构建（Go c-shared + JNI wrapper + Java App）
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        run: |
          NDK_VERSION="r27"
          curl -L -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp/
          echo "/tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build ECH shared library (arm64)
        run: |
          cd ech-proxy-android
          CGO_ENABLED=1 \
          GOOS=android \
          GOARCH=arm64 \
          CC=aarch64-linux-android21-clang \
          go build -buildmode=c-shared -ldflags="-s -w" -o libechproxy.so .
          ls -lh libechproxy.so

      - name: Copy library to Android project
        run: |
          mkdir -p ech-proxy-android/android/app/src/main/jniLibs/arm64-v8a
          cp ech-proxy-android/libechproxy.so ech-proxy-android/android/app/src/main/jniLibs/arm64-v8a/

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle 8.5
        run: |
          curl -L -o /tmp/gradle-8.5.zip "https://services.gradle.org/distributions/gradle-8.5-bin.zip"
          unzip -q /tmp/gradle-8.5.zip -d /tmp/
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          cd ech-proxy-android/android
          ./gradlew assembleRelease --no-daemon

      - name: List APK output
        run: |
          find ech-proxy-android/android/app/build/outputs -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ech-proxy-android/android/app/build/outputs/apk/release/*.apk

  release:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 每个 exe 的功能"
            cat RELEASE.md 2>/dev/null || true
            echo ""
            echo "## Android APK"
            echo "ECH Proxy Android 客户端，使用 ECH 代理访问 各上游站点。"
            echo "下载 app-release.apk 安装到手机。"
          } > release_body.md
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes-file release_body.md

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | while read -r f; do
            filename=$(basename "$f")
            label="${filename}"
            echo "Uploading: $label"
            gh release upload "${{ github.ref_name }}" "${f}#${label}" --clobber --repo "${{ github.repository }}"
          done
