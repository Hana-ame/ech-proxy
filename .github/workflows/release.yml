name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows]
        arch: [amd64, aarch64]
        exclude:
          - os: windows
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build ech-proxy desktop (static, CGO off for old-glibc/Termux)
        run: |
          ext=""
          [ "${{ matrix.os }}" = "windows" ] && ext=".exe"
          mkdir -p "dist/${{ matrix.os }}/${{ matrix.arch }}"
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }} CGO_ENABLED=0 \
             go build -trimpath -ldflags="-s -w" \
             -o "dist/${{ matrix.os }}/${{ matrix.arch }}/ech-proxy-${{ matrix.os }}-${{ matrix.arch }}${ext}" "./win/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ matrix.os }}/${{ matrix.arch }}/

  # Android APK build (Go c-shared + JNI wrapper + Java App)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        run: |
          NDK_VERSION="r27"
          curl -L -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp/
          echo "/tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build ECH shared library (arm64)
        run: |
          cd android
          CGO_ENABLED=1 \
          GOOS=android \
          GOARCH=arm64 \
          CC=aarch64-linux-android21-clang \
          go build -buildmode=c-shared -ldflags="-s -w" -o libechproxy.so .
          ls -lh libechproxy.so

      - name: Copy library to Android project
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp android/libechproxy.so android/app/src/main/jniLibs/arm64-v8a/

      - name: Write keystore from Secret
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Missing GitHub Secret: KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
          test -s android/release.keystore
          echo "Keystore written: $(wc -c < android/release.keystore) bytes"

      # ubuntu-latest runner preinstalls Android SDK and cmdline-tools, but sdkmanager is not in PATH.
      # android-actions/setup-android@v3 executes `sdkmanager tools`, which Google removed
      # as obsolete from the SDK repository. Therefore, use preinstalled sdkmanager directly.
      - name: Setup Android SDK (runner preinstalled)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          # Prefer versioned cmdline-tools (e.g. 16.0) to avoid potential latest stub issues on runner
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | grep -v '/latest/' | sort -V | tail -n1)"
          [ -n "$SDKMANAGER" ] || SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Download Gradle 8.5
        run: |
          curl -L -o /tmp/gradle-8.5.zip "https://services.gradle.org/distributions/gradle-8.5-bin.zip"
          unzip -q /tmp/gradle-8.5.zip -d /tmp/
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.5

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: List APK output
        run: |
          find android/app/build/outputs -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  release:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Executable Features"
            cat RELEASE.md 2>/dev/null || true
            echo ""
            echo "## Android APK"
            echo "ECH Proxy Android client, accessing upstream sites via ECH proxy."
            echo "Download app-release.apk and install on your phone."
          } > release_body.md
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes-file release_body.md

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | while read -r f; do
            filename=$(basename "$f")
            label="${filename}"
            echo "Uploading: $label"
            gh release upload "${{ github.ref_name }}" "${f}#${label}" --clobber --repo "${{ github.repository }}"
          done
