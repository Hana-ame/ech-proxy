name: release

on:
  push:
    # GitHub tag filters are globs without character classes and without
    # anchoring, so no pattern can express "v<digits>.<digits>.<digits>" while
    # excluding prerelease suffixes: every candidate also matches v1.3.0-rc.1.
    # The exclusion therefore lives in the job guards below, where it can be
    # expressed. GoReleaser needs semver tags, which is why they must diverge.
    tags:
      - "v*"

jobs:
  # NOTE: desktop binaries + checksums + ech-proxy.443.exe are published solely by
  # goreleaser.yml (GoReleaser). release.yml previously also built/uploaded desktop
  # binaries (ech-proxy-{linux,windows}-{amd64,aarch64,386}), which collided with
  # GoReleaser's same-named uploads on the same release (422 already_exists, flaky
  # by timing). release.yml now owns only the Android APKs + the release notes body,
  # restoring the documented design (see goreleaser.yml header) of non-overlapping assets.

  # Android APK build (Go c-shared + JNI wrapper + Java App)
  build-android:
    if: ${{ !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-beta.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        run: |
          NDK_VERSION="r27"
          curl -L -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp/
          echo "/tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build ECH shared library (arm64)
        run: |
          cd android
          CGO_ENABLED=1 \
          GOOS=android \
          GOARCH=arm64 \
          CC=aarch64-linux-android21-clang \
          go build -buildmode=c-shared -ldflags="-s -w" -o libechproxy.so .
          ls -lh libechproxy.so

      - name: Copy library to Android project
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp android/libechproxy.so android/app/src/main/jniLibs/arm64-v8a/

      - name: Write keystore from Secret
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Missing GitHub Secret: KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
          test -s android/release.keystore
          echo "Keystore written: $(wc -c < android/release.keystore) bytes"

      # ubuntu-latest runner preinstalls Android SDK and cmdline-tools, but sdkmanager is not in PATH.
      # android-actions/setup-android@v3 executes `sdkmanager tools`, which Google removed
      # as obsolete from the SDK repository. Therefore, use preinstalled sdkmanager directly.
      - name: Setup Android SDK (runner preinstalled)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          # Prefer versioned cmdline-tools (e.g. 16.0) to avoid potential latest stub issues on runner
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | grep -v '/latest/' | sort -V | tail -n1)"
          [ -n "$SDKMANAGER" ] || SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Download Gradle 8.5
        run: |
          curl -L -o /tmp/gradle-8.5.zip "https://services.gradle.org/distributions/gradle-8.5-bin.zip"
          unzip -q /tmp/gradle-8.5.zip -d /tmp/
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.5

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          mkdir -p app/build/outputs/apk/release
          find app/build/outputs/apk -type f -name "ech-proxy-android-*.apk" -exec cp {} app/build/outputs/apk/release/ \;

      - name: List APK output
        run: |
          find android/app/build/outputs -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  release:
    if: ${{ !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-beta.') }}
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Executable Features"
            cat RELEASE.md 2>/dev/null || true
            echo "## Android APKs"
            echo "Two versions of the Android APK are provided in this release:"
            echo '- **Standard (`ech-proxy-android-<version>.apk`)**: Background-safe with Foreground Service & WakeLock (exempt from Android 11+ Cached Apps Freezer and Doze mode).'
            echo '- **Lite / No-Perm (`ech-proxy-android-lite-<version>.apk`)**: Zero runtime permissions required, no notifications or background service.'
          } > release_body.md

          # Wait up to 5 minutes for GoReleaser (goreleaser.yml) to create and publish the release first.
          # GoReleaser compiles desktop binaries (~3.5m) and publishes the tag.
          # Waiting avoids concurrent release creation race conditions (HTTP 422 tag_name already_exists).
          echo "Waiting for GoReleaser to publish release ${{ github.ref_name }}..."
          RELEASE_FOUND=0
          for i in $(seq 1 30); do
            if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Published release ${{ github.ref_name }} found!"
              RELEASE_FOUND=1
              break
            fi
            sleep 10
          done

          if [ "$RELEASE_FOUND" -eq 0 ]; then
            echo "GoReleaser did not publish within timeout; creating release as fallback..."
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes-file release_body.md || true
          fi

          # Update release title and notes to include feature notes and Android APK documentation
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes-file release_body.md || true

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | while read -r f; do
            filename=$(basename "$f")
            label="${filename}"
            echo "Uploading: $label"
            # Never overwrite an asset that already exists in a published release.
            # On a re-run for the same tag the upload fails with "already exists";
            # keep the existing asset and warn instead of replacing it.
            gh release upload "${{ github.ref_name }}" "${f}#${label}" --repo "${{ github.repository }}" || \
              echo "::warning::asset already exists for ${{ github.ref_name }}: $label (existing asset kept)"
          done
