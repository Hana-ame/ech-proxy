# GoReleaser configuration for ech-proxy desktop binaries.
#
# Scope: this produces the DESKTOP binaries only (linux/windows/darwin, amd64 +
# arm64). Android APKs are built by .github/workflows/release.yml via Gradle and
# are not part of this config.
#
# Tag trigger: v*. This deliberately overlaps with release.yml, which also
# fires on v*. See the note on release.draft below and PR discussion for how
# the two are kept from fighting over assets.

version: 2

project_name: ech-proxy

before:
  hooks:
    - go mod tidy

builds:
  - id: ech-proxy
    main: ./win/
    binary: ech-proxy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - "386"
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: arm64
      # darwin never supported 32-bit x86; Go builds darwin only amd64/arm64.
      - goos: darwin
        goarch: "386"
    # Explicit binary naming. The existing releases shipped raw binaries named
    # ech-proxy-<os>-<arch>[.exe]; keeping that shape means a GoReleaser
    # release is a drop-in replacement rather than a second, differently
    # shaped set of assets.
    #
    # Note: in GoReleaser v2 "format" and "name_template" are archive-level
    # settings, not build-level ones. Listing them here is a config error and
    # `goreleaser check` rejects it.
    #
    # The actual naming is set under the archives section below.
  - id: ech-proxy-443
    # The convenience variant for the local reverse proxy mode. The binary is
    # identical — the same source compiled — but the output filename ends in
    # ".443.exe", which is exactly what win/main.go's filenameIs443 matches:
    # the artifact auto-starts on 127.0.0.1:443 in local proxy mode with no
    # flags, straight from the release download.
    #
    # Only Windows amd64 is shipped because that is the platform where a
    # port-443 hosts-file redirect is the most common use case; Linux and
    # macOS users can rename any existing binary themselves.
    main: ./win/
    binary: ech-proxy.443
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - windows
    goarch:
      - amd64

# In GoReleaser v2 the "format" and the build-selection key both moved:
# archives.format -> archives.formats, and archives.builds -> archives.ids.
# Both deprecated keys still parse, but `goreleaser check` fails the release on
# deprecations, so they cannot be used. archives.builds was introduced by PR #13
# to split the 443 variant, and `goreleaser-action@v6` floats `~> v2`, so the
# bit-rot only bit at v1.4.0 (v1.3.0 had a single archive and no such key): the
# run died at `goreleaser check` with exit 2 before any binary was built.
archives:
  # No archive wrapper: consumers fetch the raw binary, matching release.yml's
  # existing output so a GoReleaser release is a drop-in replacement rather
  # than a second, differently shaped set of assets.
  #
  # Two entries because the two builds need different filenames, and a
  # name_template cannot branch on the build id:
  #
  #   regular build -> ech-proxy-<os>-<arch>[.exe]  (unchanged from before)
  #   443 build     -> ech-proxy.443.exe             (the literal filename, so
  #                        it auto-triggers local proxy mode when run)
  #
  # The "binary" format appends the platform extension itself, so the
  # template must NOT add .exe: doing so produced
  # ech-proxy-windows-amd64.exe.exe on the first pipeline run. With
  # name_template = "{{ .Binary }}" and binary = "ech-proxy.443" the 443
  # artifact becomes exactly ech-proxy.443.exe.
  - id: binary
    formats: ["binary"]
    ids:
      - ech-proxy
    name_template: >-
      {{ .Binary }}-{{ .Os }}-{{ .Arch }}
  - id: binary-443
    formats: ["binary"]
    ids:
      - ech-proxy-443
    # Expected log noise, not a misconfiguration: this archive's name resolves to
    # the same string as the raw build output ("ech-proxy.443.exe"), because the
    # filename IS the feature — win/main.go's filenameIs443 matches it to auto-run
    # the local proxy. GoReleaser therefore logs
    #   "artifact already present in the list  name=ech-proxy.443.exe"
    # with "please make sure your configuration is correct". It is correct: the
    # pair is one UploadableBinary (published) and one raw Binary (never
    # uploaded), both pointing at the same file. Only this archive collides —
    # the regular template ({{ .Binary }}-{{ .Os }}-{{ .Arch }}) differs from
    # the raw name.
    name_template: >-
      {{ .Binary }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# --- Release mode: this repository does not produce drafts -------------------
#
# Decision (2026-10-04, explicit instruction "no drafts allowed"): a draft is
# not an acceptable state here. A draft is invisible to unauthenticated
# readers, so a leftover draft reads as "no release exists" while its assets sit
# there unpublished. Stage 1 produced exactly that, and it had to be deleted
# rather than kept.
#
# draft is hardcoded false below, and the workflow carries a guard that fails the
# build if a draft is ever produced, so this cannot silently regress.
#
# Two more properties this file must keep:
#
# 1. An -rc / -beta tag must NOT become the "latest" release. GitHub points
#    "latest" at the newest non-prerelease, so publishing an rc with
#    prerelease: false would push a prerelease into every user's update feed.
#    prerelease: auto derives the flag from the tag instead of hardcoding it.
#    Note goreleaser check does NOT validate this field's value (a bogus string
#    also passes), so the property is argued by tag convention plus the
#    workflow's trigger scope, not by schema.
#
# 2. Plain version tags are handled here as well as by release.yml, which also
#    builds the Android APKs. Both run on such a tag: GoReleaser contributes
#    the desktop binaries and checksums, release.yml contributes the APKs, and
#    their asset names do not collide.
release:
  # Hardcoded false on purpose — see the header note. Do not flip this back.
  draft: false
  prerelease: auto
  # A plain release must claim "latest"; a prerelease must not.
  #
  # This was originally hardcoded to false, to stop an -rc from being offered to
  # every user's update feed. That was right about rc and wrong about plain
  # releases: v1.3.0 published correctly but latest stayed pinned to v1.2.1,
  # because a hardcoded false blocks plain releases too.
  #
  # So the decision is derived from the tag instead. On a plain tag GoReleaser
  # marks the release as latest; on -rc/-beta it leaves it alone, which is what
  # the original safeguard was for.
  #
  # goreleaser check does not validate this field's value (a bogus string also
  # passes), so it is verified by observing the published release, not by schema.
  make_latest: '{{ if .Prerelease }}false{{ else }}true{{ end }}' 
  name_template: "{{ .ProjectName }} {{ .Version }}"
  footer: |
    ## Checksums

    Verify a download against `checksums.txt`:

    ```
    sha256sum -c --ignore-missing checksums.txt
    ```
  disable: false

# Deliberately not configured: signing (no cosign key), notarization, snapcraft,
# homebrew, nfpm, docker. Those need credentials or extra infrastructure this
# repo does not have yet. Add them only when there is something to sign with.
