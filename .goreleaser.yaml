# GoReleaser configuration for ech-proxy desktop binaries.
#
# Scope: this produces the DESKTOP binaries only (linux/windows/darwin, amd64 +
# arm64). Android APKs are built by .github/workflows/release.yml via Gradle and
# are not part of this config.
#
# Tag trigger: v*. This deliberately overlaps with release.yml, which also
# fires on v*. See the note on release.draft below and PR discussion for how
# the two are kept from fighting over assets.

version: 2

project_name: ech-proxy

before:
  hooks:
    - go mod tidy

builds:
  - id: ech-proxy
    main: ./win/
    binary: ech-proxy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: arm64
    # Explicit binary naming. The existing releases shipped raw binaries named
    # ech-proxy-<os>-<arch>[.exe]; keeping that shape means a GoReleaser
    # release is a drop-in replacement rather than a second, differently
    # shaped set of assets.
    #
    # Note: in GoReleaser v2 "format" and "name_template" are archive-level
    # settings, not build-level ones. Listing them here is a config error and
    # `goreleaser check` rejects it.
    #
    # The actual naming is set under the archives section below.

# In GoReleaser v2 the "format" key moved to the top level of the archives
# entry; the deprecated per-archive form is what `goreleaser check` flagged.
archives:
  # No archive wrapper: consumers fetch the raw binary, matching release.yml's
  # existing output so a GoReleaser release is a drop-in replacement rather
  # than a second, differently shaped set of assets.
  - id: binary
    formats: ["binary"]
    # The "binary" format appends the platform extension itself, so the
    # template must NOT add .exe: doing so produced
    # ech-proxy-windows-amd64.exe.exe on the first pipeline run.
    name_template: >-
      ech-proxy-{{ .Os }}-{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# --- Release mode: this repository does not produce drafts -------------------
#
# Decision (2026-10-04, explicit instruction "no drafts allowed"): a draft is
# not an acceptable state here. A draft is invisible to unauthenticated
# readers, so a leftover draft reads as "no release exists" while its assets sit
# there unpublished. Stage 1 produced exactly that, and it had to be deleted
# rather than kept.
#
# draft is hardcoded false below, and the workflow carries a guard that fails the
# build if a draft is ever produced, so this cannot silently regress.
#
# Two more properties this file must keep:
#
# 1. An -rc / -beta tag must NOT become the "latest" release. GitHub points
#    "latest" at the newest non-prerelease, so publishing an rc with
#    prerelease: false would push a prerelease into every user's update feed.
#    prerelease: auto derives the flag from the tag instead of hardcoding it.
#    Note goreleaser check does NOT validate this field's value (a bogus string
#    also passes), so the property is argued by tag convention plus the
#    workflow's trigger scope, not by schema.
#
# 2. Plain version tags are handled here as well as by release.yml, which also
#    builds the Android APKs. Both run on such a tag: GoReleaser contributes
#    the desktop binaries and checksums, release.yml contributes the APKs, and
#    their asset names do not collide.
release:
  # Hardcoded false on purpose — see the header note. Do not flip this back.
  draft: false
  prerelease: auto
  # Never let a prerelease become the "latest" release. GitHub otherwise points
  # "latest" at the newest non-prerelease, so an rc published with
  # prerelease: false would be offered to every user's update feed.
  # "false" means GoReleaser leaves that decision alone for a plain release and
  # does not claim latest for an rc one.
  make_latest: false
  name_template: "{{ .ProjectName }} {{ .Version }}"
  footer: |
    ## Checksums

    Verify a download against `checksums.txt`:

    ```
    sha256sum -c --ignore-missing checksums.txt
    ```
  disable: false

# Deliberately not configured: signing (no cosign key), notarization, snapcraft,
# homebrew, nfpm, docker. Those need credentials or extra infrastructure this
# repo does not have yet. Add them only when there is something to sign with.
