apply plugin: 'com.android.application'

android {
    namespace 'xyz.moonchan.echproxy'
    compileSdk 34

    defaultConfig {
        applicationId "xyz.moonchan.echproxy"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Signing configs (read from environment variables, CI uses GitHub Secrets)
    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/release.keystore")
            storePassword "${System.getenv('KEYSTORE_PASSWORD') ?: 'android'}"
            keyAlias "${System.getenv('KEY_ALIAS') ?: 'release'}"
            keyPassword "${System.getenv('KEY_PASSWORD') ?: 'android'}"
            v1SigningEnabled true  // minSdk 21 requires v1
            v2SigningEnabled true  // Android 7.0+
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.release  // Use release signing during development
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
