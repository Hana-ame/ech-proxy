apply plugin: 'com.android.application'

def getAppVersionName() {
    def envTag = System.getenv("VERSION_NAME") ?: System.getenv("GITHUB_REF_NAME")
    if (envTag) {
        return envTag.replaceFirst("^v", "")
    }
    try {
        def proc = ['git', 'describe', '--tags', '--always'].execute()
        proc.waitFor()
        def desc = proc.text.trim()
        if (desc.startsWith("v")) {
            return desc.substring(1)
        }
        return desc ?: "1.0"
    } catch (Exception ignored) {
        return "1.0"
    }
}

def getAppVersionCode() {
    def envCode = System.getenv("VERSION_CODE")
    if (envCode && envCode.isInteger()) {
        return envCode.toInteger()
    }
    def vName = getAppVersionName()
    def matcher = (vName =~ /^(\d+)\.(\d+)(?:\.(\d+))?/)
    if (matcher.find()) {
        int major = matcher.group(1).toInteger()
        int minor = matcher.group(2).toInteger()
        int patch = matcher.group(3) ? matcher.group(3).toInteger() : 0
        return major * 10000 + minor * 100 + patch
    }
    def runNum = System.getenv("GITHUB_RUN_NUMBER")
    if (runNum && runNum.isInteger()) {
        return runNum.toInteger()
    }
    return 1
}

android {
    namespace 'xyz.moonchan.echproxy'
    compileSdk 34

    defaultConfig {
        applicationId "xyz.moonchan.echproxy"
        minSdk 21
        targetSdk 34
        versionCode getAppVersionCode()
        versionName getAppVersionName()

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Signing configs (read from environment variables, CI uses GitHub Secrets)
    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/release.keystore")
            storePassword "${System.getenv('KEYSTORE_PASSWORD') ?: 'android'}"
            keyAlias "${System.getenv('KEY_ALIAS') ?: 'release'}"
            keyPassword "${System.getenv('KEY_PASSWORD') ?: 'android'}"
            v1SigningEnabled true  // minSdk 21 requires v1
            v2SigningEnabled true  // Android 7.0+
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.release  // Use release signing during development
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "ech-proxy-android-${variant.versionName}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
