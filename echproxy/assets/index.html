<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECH Proxy Portal</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e6e6e6; }
.container { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
header { margin-bottom: 20px; }
header h1 { font-size: 22px; color: #5ce1e6; letter-spacing: 0.5px; }
header .sub { font-size: 12px; color: #888; margin-top: 4px; }
.list { display: flex; flex-direction: column; gap: 12px; }
.card {
  background: #171a21; border: 1px solid #232733; border-radius: 10px;
  overflow: hidden; transition: border-color 0.15s, box-shadow 0.15s;
}
.card:hover { border-color: #5ce1e6; box-shadow: 0 4px 16px rgba(92, 225, 230, 0.08); }
.card .item {
  display: flex; text-decoration: none; color: inherit; align-items: center; gap: 14px;
  padding: 14px 16px; transition: background 0.15s;
}
.card .item:hover { background: rgba(255, 255, 255, 0.02); }
.item .badge {
  width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: #fff;
}
.item .info { flex: 1; min-width: 0; }
.item .info .entry { font-size: 15px; font-weight: 600; color: #5ce1e6; word-break: break-all; }
.item .info .desc { font-size: 13px; color: #aab; margin-top: 2px; }
.item .info .target { font-size: 11px; color: #667; margin-top: 4px; word-break: break-all; }
.item .mode {
  flex-shrink: 0; font-size: 11px; padding: 3px 8px; border-radius: 20px;
  background: #2a2f3a; color: #8fa3bf; border: 1px solid #333a47;
}
.footer { margin-top: 24px; text-align: center; font-size: 11px; color: #556; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>ECH Proxy</h1>
    <div class="sub">Upstream Portal List · 点击条目即可通过 ECH / SNI 代理访问目标站点</div>
  </header>
  <div class="list">
    {{UPSTREAMS}}
  </div>
  <div class="footer">ECH Proxy · powered by l.moonchan.xyz</div>
</div>
</body>
</html>
